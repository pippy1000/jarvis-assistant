[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A simple Jarvis-style assistant app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.1",
]

[project.scripts]
jarvis = "jarvis_assistant.cli:main"
ant-sim = "jarvis_assistant.ant_sim:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
